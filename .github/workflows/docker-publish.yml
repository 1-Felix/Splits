name: publish image

# Build the SPLITS image and push it to this repo's GitHub Container Registry.
#   • push to main        → ghcr.io/1-felix/splits:latest (+ :sha-<short>)
#   • push a vX.Y.Z tag   → ghcr.io/1-felix/splits:X.Y.Z (+ :X.Y, :latest)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The suite and the responsive gate run BEFORE anything is built. Until
  # make-mobile-native there was no `pnpm test` at all and CI published an
  # image without running a single test; a red suite must now block the push,
  # not be discovered on the NUC.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # the suite and the gate both drive headless chromium
      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test suite
        run: pnpm test

      # runs against the committed fixture (fixtures/layout/), so the result
      # does not depend on telemetry that CI does not have
      - name: Responsive layout gate
        run: pnpm run test:layout

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Creates a docker-container builder — required for the gha build cache
      # (the default "docker" driver can't export cache).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/1-felix/splits
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
